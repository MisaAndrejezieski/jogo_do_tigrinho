<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo do Tigrinho</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>

<div id="container">
    <div class="game-info">
        <div class="balance-container">
            <span>Saldo: <span id="balance">1000</span> moedas</span>
        </div>
        <div class="bet-container">
            <button onclick="decreaseBet()">-</button>
            <span>Aposta: <span id="current-bet">10</span> moedas</span>
            <button onclick="increaseBet()">+</button>
        </div>
    </div>

    <div class="window-border">
        <div class="window">
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
            <div class="outer-col">
                <div class="col"></div>
            </div>
            <div class="outer-spacer"></div>
        </div>
    </div>

    <input type="button" onclick="spin(this)" class="start-button" value="Girar"/>
</div>

</body>
</html>
